appId: com.healthyapp.app
---
# A signed-out launch lands on making an account, with the way back in for
# existing accounts. The splash shows only while launch work runs, so it is
# not asserted.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'auth-google'
    timeout: 10000
- assertVisible:
    id: 'onboarding-login'
