services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
      POSTGRES_DB: product
    ports:
      # Host 5433 avoids colliding with a local Postgres already bound on 5432.
      - '5433:5432'
    volumes:
      - product_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U product -d product']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: healthy
      MINIO_ROOT_PASSWORD: healthylocal
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - product_minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 healthy healthylocal; do sleep 1; done;
      mc mb --ignore-existing local/healthy-clips-local;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://product:product@postgres:5432/product?schema=public
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: local-dev-secret-change-me
      NODE_ENV: development
      MEMBERSHIP_BYPASS: "1"
      SMTP_HOST: "0"
      SMTP_PORT: "0"
      SMTP_USER: "0"
      SMTP_PASS: "0"
      SMTP_FROM: "0"
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: healthy-clips-local
      STORAGE_ACCESS_KEY_ID: healthy
      STORAGE_SECRET_ACCESS_KEY: healthylocal
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  product_pg:
  product_minio:
