services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product
      POSTGRES_DB: product
    ports:
      # Host 5433 avoids colliding with a local Postgres already bound on 5432.
      - '5433:5432'
    volumes:
      - product_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U product -d product']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://product:product@postgres:5432/product?schema=public
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: local-dev-secret-change-me
      NODE_ENV: development
      SMTP_HOST: "0"
      SMTP_PORT: "0"
      SMTP_USER: "0"
      SMTP_PASS: "0"
      SMTP_FROM: "0"
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  product_pg:
